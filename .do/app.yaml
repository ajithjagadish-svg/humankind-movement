# DigitalOcean App Platform spec for humankindmovement.in
#
# Single service, replacing the previous two-component (Static Site + Service)
# setup. This one Express app now serves the static marketing pages itself
# (see server/routes/marketing.js) as well as /admin and /blog.
#
# To apply: DO dashboard -> your app -> Settings -> App Spec -> paste this
# in -> Save. Or, with doctl installed and authenticated:
# `doctl apps update <APP_ID> --spec .do/app.yaml`

name: humankind-movement
region: nyc
domains:
  - domain: humankindmovement.in
    type: PRIMARY

services:
  - name: humankind-movement-server
    source_dir: /
    build_command: npm install
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BREVO_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BREVO_SENDER_EMAIL
        scope: RUN_TIME
        value: hello@humankindmovement.in
      - key: BREVO_SENDER_NAME
        scope: RUN_TIME
        value: Humankind Movement
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 10
      failure_threshold: 3
    routes:
      - path: /
