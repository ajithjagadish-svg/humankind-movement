# Keeps the dollar/pound/euro figures next to rupee prices current, with no manual steps.
# Runs on the 1st and 16th of each month. Most runs change nothing. The update script refuses to
# touch anything unless every safety check passes (see server/scripts/update-fx-display.js), so on
# any problem the site just keeps its last good figures and GitHub emails about the failed run.
# After publishing, the live site is checked. If a page serves the new figures but is broken, the
# commit is reverted automatically (once). If the deploy is merely slow or missing, nothing is
# reverted and the run fails so you get an email.
# To pause it: Actions tab > "Refresh currency figures" > Disable workflow.
name: Refresh currency figures

on:
  schedule:
    - cron: '17 3 1,16 * *'   # 03:17 UTC (08:47 IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check only, do not change or publish anything'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fx-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Self-test (the update is skipped if the safety checks themselves fail)
        run: node --test server/scripts/update-fx-display.test.js

      - name: Check rates and refresh figures
        run: node server/scripts/update-fx-display.js --message-file "$RUNNER_TEMP/fx-commit.txt" ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Publish if anything changed
        id: publish
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No figure changes needed."
            exit 0
          fi
          ALLOWED='^(server/config/fx\.json|server/config/i18n\.js|(index|about|contact|the-method|who-we-serve|movement-coaching-bengaluru)\.html|services/(index|neurodivergent-coaching|one-to-one-coaching|postpartum-support)\.html)$'
          if git diff --name-only | grep -Ev "$ALLOWED"; then
            echo "Unexpected files changed; refusing to publish."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -F "$RUNNER_TEMP/fx-commit.txt"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Check the live site serves the new figures and is healthy
        id: verify
        if: steps.publish.outputs.published == 'true'
        run: |
          set +e
          node server/scripts/verify-live-site.js --base https://humankindmovement.in --max-minutes 15 --interval-seconds 30
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Undo the update if it broke a live page
        if: steps.verify.outputs.code == '3'
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git revert --no-edit "${{ steps.publish.outputs.sha }}"
          git push origin HEAD:main
          echo "A live page was broken after the update, so the update was reverted."
          exit 1

      - name: Fail loudly if the deploy never showed up
        if: steps.verify.outputs.code == '4'
        run: |
          echo "The new figures were published to GitHub but the live site did not show them within 15 minutes (deploy slow, failed, or not triggered). Nothing was reverted. Check the DigitalOcean deploy."
          exit 1
